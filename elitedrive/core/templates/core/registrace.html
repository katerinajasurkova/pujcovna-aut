{% load static %}
<link rel="stylesheet" href="{% static 'core/style.css' %}">

<div class="login-page">
    <div class="login-box">

        <h1>Registrace zákazníka</h1>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                {{ form.username }}
            </div>
            
            <div class="form-group">
                {{ form.password1 }}
            </div>
            
            <div class="form-group">
                {{ form.password2 }}
            </div>

            <button type="submit" class="register-btn">
                Registrovat
            </button>
        </form>

        <p class="login-link">
            Už máte účet?
            <a href="{% url 'vyber_login' %}">
                Přihlásit se
            </a>
        </p>

    </div>
</div>
